<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockSense – Inventory Dashboard</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2233;--muted:#6b7385;--line:#e3e7f0;--brand:#2f5597;--ok:#1a8f5a;--low:#c9820a;--out:#c93a3a}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--text:#e8ecf5;--muted:#98a2b8;--line:#263049;--brand:#7aa2ff;--ok:#3ccf8e;--low:#f0b24a;--out:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:Calibri,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.6rem;color:var(--brand)}
.sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
button,select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:1.6rem}
.stat span{color:var(--muted);font-size:.85rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:1rem}
.bar{display:grid;grid-template-columns:130px 1fr 50px;gap:8px;align-items:center;font-size:.85rem;margin:5px 0}
.bar i{display:block;height:10px;border-radius:6px;background:var(--brand)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.controls input[type=search]{flex:1;min-width:180px}
.controls input[type=number]{width:80px}
.controls label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.item img{width:100%;height:120px;object-fit:contain;background:var(--bg);border-radius:8px}
.item h3{margin:0;font-size:1rem}
.cat{color:var(--muted);font-size:.8rem;text-transform:capitalize}
.row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%}
.badge{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}
.msg{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:520px){.bar{grid-template-columns:90px 1fr 40px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>StockSense</h1>
      <p class="sub">Inventory dashboard – see what is selling out before it becomes a problem.</p>
    </div>
    <button id="theme" aria-label="Toggle dark mode">Toggle theme</button>
  </header>

  <section class="stats" id="stats"></section>

  <section class="panel">
    <h2>Stock units by category (top 8)</h2>
    <div id="chart"></div>
  </section>

  <section class="controls">
    <input type="search" id="search" placeholder="Search products..." aria-label="Search products">
    <select id="category" aria-label="Filter by category"><option value="all">All categories</option></select>
    <select id="sort" aria-label="Sort products">
      <option value="stock-asc">Stock: low to high</option>
      <option value="stock-desc">Stock: high to low</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="name">Name A–Z</option>
    </select>
    <label>Low-stock limit <input type="number" id="limit" value="20" min="1" max="100"></label>
    <label><input type="checkbox" id="lowOnly"> Low stock only</label>
  </section>

  <div id="list" class="grid"></div>
</div>

<script>
const API = "https://dummyjson.com/products?limit=100&select=title,category,price,stock,thumbnail";
// Small backup data so the page still works if the API is unreachable
const FALLBACK = [
  {id:1,title:"Wireless Mouse",category:"accessories",price:19.99,stock:8},
  {id:2,title:"USB-C Cable",category:"accessories",price:7.5,stock:64},
  {id:3,title:"Office Chair",category:"furniture",price:129,stock:0},
  {id:4,title:"Desk Lamp",category:"furniture",price:24.9,stock:17},
  {id:5,title:"Notebook Pack",category:"stationery",price:5.2,stock:120},
  {id:6,title:"Gel Pens (10)",category:"stationery",price:4.1,stock:12}
];

let products = [];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const limit = () => Math.max(1, Number($("limit").value) || 20);
const status = p => p.stock === 0 ? ["Out of stock","var(--out)"] : p.stock < limit() ? ["Low stock","var(--low)"] : ["In stock","var(--ok)"];

async function load(){
  $("list").innerHTML = '<div class="msg">Loading products...</div>';
  try{
    const res = await fetch(API);
    if(!res.ok) throw new Error("HTTP " + res.status);
    products = (await res.json()).products;
  }catch(err){
    console.warn("API failed, using backup data:", err);
    products = FALLBACK;
  }
  const cats = [...new Set(products.map(p => p.category))].sort();
  $("category").innerHTML = '<option value="all">All categories</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  render();
}

function render(){
  const q = $("search").value.trim().toLowerCase();
  const cat = $("category").value;
  const sort = $("sort").value;
  const lowOnly = $("lowOnly").checked;

  let rows = products.filter(p =>
    (cat === "all" || p.category === cat) &&
    p.title.toLowerCase().includes(q) &&
    (!lowOnly || p.stock < limit()));

  const sorters = {
    "stock-asc":(a,b)=>a.stock-b.stock, "stock-desc":(a,b)=>b.stock-a.stock,
    "price-asc":(a,b)=>a.price-b.price, "price-desc":(a,b)=>b.price-a.price,
    "name":(a,b)=>a.title.localeCompare(b.title)
  };
  rows.sort(sorters[sort]);

  // summary cards (based on all products)
  const total = products.reduce((s,p)=>s+p.stock,0);
  const lowCount = products.filter(p=>p.stock>0 && p.stock<limit()).length;
  const outCount = products.filter(p=>p.stock===0).length;
  $("stats").innerHTML = [
    [products.length,"Products"],[total.toLocaleString(),"Units in stock"],
    [lowCount,"Low-stock items"],[outCount,"Out of stock"]
  ].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");

  // simple bar chart (no library): stock units per category
  const byCat = {};
  products.forEach(p => byCat[p.category] = (byCat[p.category]||0) + p.stock);
  const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max = Math.max(...top.map(t=>t[1]), 1);
  $("chart").innerHTML = top.map(([c,v]) =>
    `<div class="bar"><span>${esc(c)}</span><i style="width:${(v/max*100).toFixed(1)}%"></i><span>${v}</span></div>`).join("");

  // product cards
  $("list").innerHTML = rows.length ? rows.map(p => {
    const [label,color] = status(p);
    const pct = Math.min(100, p.stock);
    const img = p.thumbnail ? `<img src="${esc(p.thumbnail)}" alt="${esc(p.title)}" loading="lazy">` : "";
    return `<article class="item">${img}
      <h3>${esc(p.title)}</h3><span class="cat">${esc(p.category)}</span>
      <div class="row"><strong>$${p.price.toFixed(2)}</strong><span class="badge" style="background:${color}">${label}</span></div>
      <div class="meter"><i style="width:${pct}%;background:${color}"></i></div>
      <div class="row"><span>${p.stock} units</span></div></article>`;
  }).join("") : '<div class="msg">No products match your filters.</div>';
}

["search","category","sort","limit","lowOnly"].forEach(id => $(id).addEventListener("input", render));
$("theme").addEventListener("click", () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
});
if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
load();
</script>
</body>
</html>
